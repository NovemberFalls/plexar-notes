<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plexar Notes</title>
<link rel="stylesheet" href="plexar-tokens.css">
<style>
body{margin:0; min-height:100vh; background:var(--px-bg); color:var(--px-text); font-family:var(--px-font-ui)}
main{max-width:640px; margin:0 auto; padding:32px 16px; display:flex; flex-direction:column; gap:16px}
h1{margin:0; font-family:var(--px-font-display); font-weight:500; color:var(--px-fg)}
form{display:flex; gap:8px}
input{flex:1; padding:10px 12px; border-radius:var(--px-radius-sm); border:1px solid var(--px-border); background:var(--px-surface); color:var(--px-fg)}
button{padding:10px 14px; border-radius:var(--px-radius-sm); border:1px solid var(--px-accent); background:var(--px-accent); color:var(--px-bg); cursor:pointer}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
li{display:flex; justify-content:space-between; gap:8px; padding:12px; border-radius:var(--px-radius); background:var(--px-surface); border:1px solid var(--px-border)}
li button{background:none; color:var(--px-muted); border-color:var(--px-border); padding:4px 10px}
</style></head><body>
<main>
  <h1>Plexar Notes</h1>
  <form id="add"><input id="text" placeholder="Write a note" aria-label="note"><button>Add</button></form>
  <ul id="list"></ul>
</main>
<script src="notes.js"></script>
<script>
let notes = [];
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const n of notes){
    const li = document.createElement("li");
    li.textContent = n.text;
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = () => { notes = removeNote(notes, n.id); render(); };
    li.append(del);
    list.append(li);
  }
}
document.getElementById("add").onsubmit = e => {
  e.preventDefault();
  const box = document.getElementById("text");
  notes = addNote(notes, box.value);
  box.value = "";
  render();
};
render();
</script>
</body></html>
